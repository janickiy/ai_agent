server {
    listen 80;
    listen [::]:80;
    server_name news.awi.one;

    root /var/html/news.awi.one/www/public;
    index index.php;

    access_log /var/log/nginx/news.awi.one.access.log;
    error_log /var/log/nginx/news.awi.one.error.log;

    client_max_body_size 20m;
    charset utf-8;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
        access_log off;
    }
}
